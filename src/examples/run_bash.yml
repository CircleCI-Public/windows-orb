description: >
  Run a job on Windows with Bash as the default shell. The bash executor uses
  the same image and size options as the default executor, so steps (and orbs
  written for a POSIX shell) do not need their own shell setting.
usage:
  version: 2.1
  orbs:
    win: circleci/windows@5.2
  jobs:
    build:
      executor:
        name: win/bash
        size: medium
      steps:
        - checkout
        - run: echo "Hello from Bash $BASH_VERSION"
  workflows:
    my-workflow:
      jobs:
        - build
