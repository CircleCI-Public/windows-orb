description: |
  This is an example of running a simple job on the Windows Server 2025 cuda (GPU) executor
usage:
  version: 2.1
  orbs:
    win: circleci/windows@5.1
  jobs:
    build:
      executor: win/server-2025-cuda
      steps:
        - run: Write-Host 'Hello, Windows'
  workflows:
    my-workflow:
      jobs:
        - build
